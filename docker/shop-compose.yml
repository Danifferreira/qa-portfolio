# A private copy of the demo shop, started only inside the CI runner.
# It uses the shop's official images, pinned to one version so the daily run
# does not change under the tests. Nothing here is published or exposed.
name: shop

services:
  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api:2.5
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
      - DB_PORT=3306
      - DB_HOST=mariadb
      - host=localhost
      - DISABLE_LOGGING=true
    volumes:
      - api-code:/var/www
    depends_on:
      - mariadb

  web:
    # The shop's own web image is built for ARM only, so a standard nginx serves the API.
    image: nginx:1.27-alpine
    ports:
      - 8091:80
    volumes:
      - api-code:/var/www
      - ./shop-api-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel-api

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui:2.5
    ports:
      - 4200:4200
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"

volumes:
  api-code:
